services:
  - type: web
    name: crm-capstone-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: IA_BASE_URL
        sync: false
      - key: IA_API_KEY
        sync: false
      - key: IA_MODELO
        sync: false
      - key: IA_TEMPERATURA
        value: ""
      - key: IA_MAX_TOKENS
        value: "1200"
